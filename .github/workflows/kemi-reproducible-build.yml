name: KEMI Reproducible Build

on:
  push:
    branches:
      - kboard-preview-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source and pinned submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.1.0
            ndk;28.0.13004108
            cmake;3.31.6

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"

      - name: Prepopulate Gradle wrapper distribution
        env:
          GRADLE_USER_HOME: /root/.gradle
        run: |
          gradle_zip="gradle-9.4.1-bin.zip"
          dist_url="https://services.gradle.org/distributions/$gradle_zip"
          hash=$(printf '%s' "$dist_url" | md5sum | cut -d' ' -f1)
          dist_dir="$GRADLE_USER_HOME/wrapper/dists/gradle-9.4.1-bin/$hash"
          if [ -d "$dist_dir/gradle-9.4.1" ]; then
            echo "Wrapper distribution already present"
            exit 0
          fi
          mkdir -p "$dist_dir"
          echo "Downloading $gradle_zip..."
          for i in 1 2 3 4 5; do
            if curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 \
              "$dist_url" -o "$dist_dir/$gradle_zip"; then
              break
            fi
            echo "Download attempt $i failed; retrying..."
            sleep 10
          done
          unzip -q "$dist_dir/$gradle_zip" -d "$dist_dir"
          touch "$dist_dir/$gradle_zip.ok"
          echo "Gradle wrapper distribution ready"

      - name: Verify pinned Android toolchain
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -f "$sdk/platforms/android-36/android.jar"
          test -d "$sdk/build-tools/36.1.0"
          test -f "$sdk/ndk/28.0.13004108/source.properties"
          test -x "$sdk/cmake/3.31.6/bin/cmake"

      - name: Verify checked-out submodules
        run: |
          missing=$(git submodule status --recursive | grep '^[-U]' || true)
          if [ -n "$missing" ]; then
            echo "::error title=Incomplete submodule checkout::$missing"
            exit 1
          fi

      - name: Fetch pinned ECM source
        uses: actions/checkout@v6
        with:
          repository: KDE/extra-cmake-modules
          ref: v6.9.0
          path: .local-deps/src/extra-cmake-modules-6.9.0

      - name: Build with repository bootstrap
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$sdk" > local.properties
          ./scripts/assemble-debug-local.sh
        env:
          KEMI_GRADLE_COMMAND: ./gradlew
          KEMI_GRADLE_EXTRA_ARGS: --stacktrace
          KEMI_SUBMODULES_READY: "1"

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: kemi-arm64-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*arm64-v8a-debug.apk
          if-no-files-found: error
